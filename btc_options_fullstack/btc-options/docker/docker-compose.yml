version: "3.9"
services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # `data` is writable now so the nightly merge can fold data_live/ → data/.
      # Live recorder writes to data_live/; merge consolidates into data/.
      - C:/Users/Abhis/btc-data/data:/home/abhis/btc-data/data
      - C:/Users/Abhis/btc-data/data_live:/home/abhis/btc-data/data_live
      - C:/Users/Abhis/btc-data/derived:/home/abhis/btc-data/derived
      - C:/Users/Abhis/btc-data/logs:/home/abhis/btc-data/logs
      - ../backend/tests:/app/tests:ro
      - ../backend/app:/app/app:ro

  #  frontend:
  #    build:
  #      context: ../frontend
  #      dockerfile: ../docker/Dockerfile.frontend
  #    ports:
  #      - "3000:80"
  #    depends_on:
  #      - backend
  #    restart: unless-stopped
    
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  redis_data:
